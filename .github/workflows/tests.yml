name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - run: pip install -e ".[test]"
      # SWARMFS_TEST_BEE is unset, so tests/test_integration.py's
      # live-node tests skip themselves — this runs the offline suite only.
      - run: pytest

  # The declared floor is fsspec>=2023.6.0, and Debian/Ubuntu LTS machines
  # really do run 2024-era fsspec (dist-packages freeze at OS release, and
  # pip never upgrades a dependency that already satisfies the floor) — so
  # old-fsspec compatibility must be enforced, not remembered.
  # Transaction.__exit__ gained its `if self.fs:` guard in 2024.3.0; this
  # pins the newest release BEFORE it, the exact vintage that crashed
  # every transaction exit until the complete() fix. Minimal deps only:
  # current dask/zarr require newer fsspec, and the pandas/dask/zarr tests
  # importorskip themselves away — the subject here is swarmfs vs fsspec.
  test-oldest-fsspec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e . pytest "eth-keys>=0.4"
          "eth-hash[pycryptodome]>=0.5" "fsspec==2024.2.0"
      - run: pytest

  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - run: twine check dist/*
      # regression guard: the sdist must never bundle local tooling config
      # (it did once — a leaked postage-batch ID and shell history) or ship
      # without the LICENSE file hatchling is expected to auto-include.
      - name: verify sdist contents
        run: |
          SDIST=$(ls dist/*.tar.gz)
          if tar tzf "$SDIST" | grep -q '/\.claude/'; then
            echo "::error::sdist bundles .claude/ — local tooling config must not ship"
            exit 1
          fi
          if ! tar tzf "$SDIST" | grep -q '/LICENSE$'; then
            echo "::error::sdist is missing LICENSE"
            exit 1
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
