[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "swarmfs"
version = "0.11.0"
description = "fsspec backend for Ethereum Swarm (bzz://) via the Bee HTTP API"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "BSD-3-Clause" }
authors = [{ name = "Peter Foldiak" }]
keywords = ["swarm", "ethereum", "web3", "decentralized", "fsspec", "bee", "bzz", "filesystem"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Filesystems",
]
dependencies = [
    "fsspec>=2023.6.0",
    "aiohttp>=3.8",
    # keccak for BMT — load-bearing far beyond feeds: chunk verification
    # (auto-ON for gateways), the splitter (offline addressing, exact
    # batch sizing), the local-first store's swarm addressing, SOC
    # parsing. eth-hash itself has zero deps; pycryptodome is the small,
    # universally-wheeled backend. Moved here from the [feeds] extra in
    # 0.9 — before that, a plain install crashed on first gateway read.
    "eth-hash[pycryptodome]>=0.5",
]

[project.optional-dependencies]
# feed *signing* (writing) — the one genuinely optional capability, and
# the one carrying the heavier transitive tree (eth-utils, cytoolz).
# Reading and verifying feeds needs only the base install... except
# signature verification (verify_soc), which recovers the signer and so
# also needs this extra.
feeds = [
    "eth-keys>=0.4",
]
# `swarmfs mount`: fsspec's FUSE wrapper needs fusepy, which in turn needs a
# system libfuse **2** (apt install libfuse2 / libfuse2t64; macFUSE on macOS)
# — the C library is not pip-installable, hence the extra rather than a
# base dependency.
fuse = [
    "fusepy>=3",
]
test = [
    "pytest>=7",
    "pandas",
    "pyarrow",
    "dask[dataframe]",
    "zarr>=3",
    "xarray",
    "swarmfs[feeds]",
    "swarmfs[fuse]",
]

[project.entry-points."fsspec.specs"]
bzz = "swarmfs:SwarmFileSystem"
bzzf = "swarmfs:SwarmFeedFileSystem"

# The one console script: `swarmfs mount` — a mount is a process, not a
# library call. Everything else stays swarm-cli's job (see CLAUDE.md).
[project.scripts]
swarmfs = "swarmfs.cli:main"

[project.urls]
Homepage = "https://github.com/petfold/swarmfs"
Repository = "https://github.com/petfold/swarmfs"
Issues = "https://github.com/petfold/swarmfs/issues"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
markers = [
    "fuse: mounts through the kernel — needs fusepy, libfuse 2, /dev/fuse (skips otherwise)",
]

[tool.hatch.build.targets.sdist]
exclude = [".claude", ".pytest_cache", ".venv"]
